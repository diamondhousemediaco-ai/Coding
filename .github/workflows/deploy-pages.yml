name: Deploy LightDeck to GitHub Pages

on:
  push:
    branches: [claude/new-session-75v5kg, claude/light-deck-6djfw2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p out/deck
          # Inject the verified SIG-mesh module into the app in place of the /*__MESH_JS__*/
          # placeholder, so it ships inline (robust against the /deck/ document.write loader).
          node -e '
            const fs=require("fs");
            const html=fs.readFileSync("LightDeck/index.html","utf8");
            const mesh=fs.readFileSync("LightDeck/protocol/mesh.js","utf8");
            if(!html.includes("/*__MESH_JS__*/")){console.error("MESH placeholder missing");process.exit(1);}
            const out=html.replace("/*__MESH_JS__*/",()=>mesh);
            fs.mkdirSync("out/deck",{recursive:true});
            fs.writeFileSync("out/index.html",out);
            fs.writeFileSync("out/deck/app.html",out);
            console.log("Injected mesh.js ("+mesh.length+" bytes)");
          '
          cat > out/deck/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
          <title>LightDeck</title></head><body style="margin:0;background:#08070d;color:#8a8a90;font-family:-apple-system,system-ui,sans-serif">
          <div id="l" style="padding:24px">Loading LightDeck…</div>
          <script>
          fetch('app.html?t='+Date.now(),{cache:'no-store'})
            .then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
            .then(function(h){document.open();document.write(h);document.close();})
            .catch(function(e){document.getElementById('l').textContent='Load failed ('+e+') — tap reload.';});
          </script></body></html>
          HTML
          touch out/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
