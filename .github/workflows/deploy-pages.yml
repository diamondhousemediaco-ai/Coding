name: Deploy LightDeck to GitHub Pages

on:
  push:
    branches: [claude/new-session-75v5kg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (index.html only)
        run: mkdir -p out && cp LightDeck/index.html out/index.html && touch out/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
