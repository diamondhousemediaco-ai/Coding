name: Deploy LightDeck to GitHub Pages

on:
  push:
    branches: [claude/new-session-75v5kg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p out/deck
          # root: plain copy (legacy URL)
          cp LightDeck/index.html out/index.html
          # /deck/: the real app, plus a tiny loader that always fetches it fresh
          cp LightDeck/index.html out/deck/app.html
          cat > out/deck/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
          <title>LightDeck</title></head><body style="margin:0;background:#08070d;color:#8a8a90;font-family:-apple-system,system-ui,sans-serif">
          <div id="l" style="padding:24px">Loading LightDeck…</div>
          <script>
          fetch('app.html?t='+Date.now(),{cache:'no-store'})
            .then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
            .then(function(h){document.open();document.write(h);document.close();})
            .catch(function(e){document.getElementById('l').textContent='Load failed ('+e+') — tap reload.';});
          </script></body></html>
          HTML
          touch out/.nojekyll
          # TN Elite Summer League site at /league/ (carousel home + all detail pages)
          mkdir -p out/league
          cp tn-elite-summer-league/site/*.html out/league/
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
