<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LightDeck — Layout Options</title>
<style>
  :root{
    --bg:#07080c; --panel:rgba(22,25,36,.72); --brd:rgba(255,255,255,.08);
    --txt:#eef1f7; --dim:#8b93a7; --accent:#5b8cff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    color:var(--txt); background:var(--bg); -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1100px 600px at 12% -12%, rgba(91,140,255,.10), transparent 60%),
      radial-gradient(900px 500px at 112% 8%, rgba(255,120,80,.07), transparent 55%),
      linear-gradient(180deg,#07080c,#0a0c12 55%,#07080c);
    min-height:100%;
  }
  /* ---- header / toggle ---- */
  header{position:sticky; top:0; z-index:30; backdrop-filter:blur(16px);
    background:linear-gradient(180deg,rgba(7,8,12,.92),rgba(7,8,12,.5));
    border-bottom:1px solid var(--brd); padding:14px 20px;}
  .bar{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .logo{display:flex; align-items:center; gap:11px; font-weight:700; letter-spacing:.5px; font-size:20px;}
  .mark{width:30px; height:30px; border-radius:9px; position:relative;
    background:conic-gradient(from 210deg,#ff8a4c,#ffd24c,#7CFFB2,#5b8cff,#b06bff,#ff8a4c);
    box-shadow:0 0 18px rgba(91,140,255,.6);}
  .mark::after{content:""; position:absolute; inset:7px; border-radius:4px; background:#0a0c12;}
  .logo small{display:block; font-size:10px; letter-spacing:2px; color:var(--dim); font-weight:600;}
  .spacer{flex:1;}
  .seg{display:flex; background:#10131d; border:1px solid var(--brd); border-radius:13px; padding:4px; gap:4px;}
  .seg button{border:none; background:transparent; color:var(--dim); font-weight:700; font-size:13.5px;
    padding:9px 18px; border-radius:10px; cursor:pointer; transition:.18s; display:flex; align-items:center; gap:8px;}
  .seg button.on{background:linear-gradient(180deg,#2a3658,#1a2138); color:#fff; box-shadow:0 0 14px rgba(91,140,255,.35);}
  .hint{text-align:center; font-size:12.5px; color:var(--dim); padding:10px;}
  .hint b{color:var(--accent);}
  /* ================= CARDS VIEW ================= */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; padding:18px 20px 50px; max-width:1380px; margin:0 auto;}
  .card{position:relative; border-radius:20px; padding:18px; background:var(--panel); border:1px solid var(--brd); overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .card.off{opacity:.6;}
  .glow{position:absolute; inset:-40% -20% auto -20%; height:120px; filter:blur(42px); opacity:.6; pointer-events:none;}
  .card>*{position:relative;}
  .chead{display:flex; gap:12px; align-items:flex-start;}
  .swatch{width:44px; height:44px; border-radius:12px; flex:none; box-shadow:0 0 0 1px rgba(255,255,255,.12);}
  .cname{font-weight:700; font-size:16px;}
  .cmodel{font-size:11px; color:var(--dim); margin-top:2px; font-weight:600;}
  .badge{display:inline-block; margin-top:6px; font-size:9px; font-weight:800; letter-spacing:.7px; padding:3px 7px; border-radius:99px;}
  .badge.gvm{background:rgba(52,211,153,.14); color:#5ee7b0;}
  .badge.pend{background:rgba(251,191,36,.13); color:#fcd34d;}
  .pw{margin-left:auto; width:42px; height:42px; border-radius:50%; flex:none; border:1px solid var(--brd); background:#11131c; color:var(--dim); display:grid; place-items:center; font-size:18px; cursor:pointer;}
  .card:not(.off) .pw{color:#fff; border-color:var(--accent); box-shadow:0 0 14px rgba(91,140,255,.5);}
  .ctrl{margin-top:15px;}
  .ctrl .top{display:flex; justify-content:space-between; margin-bottom:6px;}
  .ctrl .k{font-size:10.5px; letter-spacing:1.2px; color:var(--dim); font-weight:700; text-transform:uppercase;}
  .ctrl .v{font-size:13.5px; font-weight:700;}
  input[type=range]{-webkit-appearance:none; width:100%; height:13px; border-radius:99px; outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; border:3px solid #e9edf6; box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .bri{background:linear-gradient(90deg,#1a1f2e,#fff);}
  .cct{background:linear-gradient(90deg,#ff9a3c,#ffd9a0,#fff,#cfe3ff,#8fb6ff);}
  /* ================= CONSOLE VIEW ================= */
  .console{padding:20px 16px 60px; max-width:1380px; margin:0 auto; overflow-x:auto;}
  .deck{display:flex; gap:12px; align-items:stretch; min-height:430px;}
  .strip{width:104px; flex:none; background:var(--panel); border:1px solid var(--brd); border-radius:16px; padding:12px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:9px; position:relative;}
  .strip.master{background:linear-gradient(180deg,#161b2c,#0e1119); border-color:rgba(91,140,255,.3);}
  .scap{width:100%; height:8px; border-radius:5px; box-shadow:0 0 12px rgba(0,0,0,.4);}
  .sname{font-size:11.5px; font-weight:700; text-align:center; line-height:1.15; min-height:28px; display:flex; align-items:center;}
  .smodel{font-size:9px; color:var(--dim); font-weight:600; margin-top:-4px;}
  .spend{font-size:8px; font-weight:800; letter-spacing:.5px; color:#fcd34d; background:rgba(251,191,36,.12); padding:2px 6px; border-radius:99px;}
  .slive{font-size:8px; font-weight:800; letter-spacing:.5px; color:#5ee7b0; background:rgba(52,211,153,.12); padding:2px 6px; border-radius:99px;}
  /* vertical fader */
  .fader{position:relative; width:42px; flex:1; min-height:170px; border-radius:11px; background:#0a0c12;
    border:1px solid var(--brd); overflow:hidden; cursor:pointer; touch-action:none;}
  .fader .fill{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,#6d97ff,#3a55b0); transition:height .05s;}
  .fader.int .fill{background:linear-gradient(180deg,#fff,#aab4cc);}
  .fader .ticks{position:absolute; inset:0; pointer-events:none; background-image:repeating-linear-gradient(180deg,transparent 0 19px,rgba(255,255,255,.06) 19px 20px);}
  .fader .cap{position:absolute; left:-3px; right:-3px; height:18px; border-radius:6px; background:#eef1f7; border:2px solid #c7cede; box-shadow:0 3px 8px rgba(0,0,0,.6); transform:translateY(9px);}
  .fval{font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;}
  .fcap-lbl{font-size:9px; letter-spacing:1px; color:var(--dim); font-weight:800; margin-top:-3px;}
  .row2{display:flex; gap:6px; width:100%; flex:1;}
  .pw2{width:100%; padding:8px 0; border-radius:10px; border:1px solid var(--brd); background:#11131c; color:var(--dim); font-size:11px; font-weight:800; letter-spacing:.5px; cursor:pointer;}
  .strip.on .pw2{color:#fff; border-color:var(--accent); background:linear-gradient(180deg,#243056,#161b2c); box-shadow:0 0 12px rgba(91,140,255,.4);}
  .strip.off-strip{opacity:.62;}
  .cctmini{font-size:11px; font-weight:700; color:var(--dim);}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="mark"></span><div>LightDeck<small>LAYOUT PREVIEW</small></div></div>
    <div class="spacer"></div>
    <div class="seg">
      <button id="tCards" class="on" onclick="setView('cards')">◧ Cards</button>
      <button id="tConsole" onclick="setView('console')">▥ Console</button>
    </div>
  </div>
</header>
<div class="hint">Tap <b>Cards</b> vs <b>Console</b> above to compare · faders + sliders are draggable · this is a visual mock (no Bluetooth)</div>

<div id="cardsView" class="grid"></div>
<div id="consoleView" class="console" style="display:none;"><div class="deck" id="deck"></div></div>

<script>
const LIGHTS=[
  {id:"k1",name:"650B Pro · Key",model:"GVM Pro 650B",cct:[2700,6800],rgb:false},
  {id:"k2",name:"650B Pro · Fill",model:"GVM Pro 650B",cct:[2700,6800],rgb:false},
  {id:"bk",name:"300D · Back",model:"GVM 300D",cct:null,rgb:false},
  {id:"ac",name:"PR150 · Accent",model:"GVM PR150",cct:[2700,6800],rgb:false},
  {id:"fx",name:"PR150R · FX",model:"GVM PR150R",cct:[2700,6800],rgb:true},
  {id:"gd",name:"LA600Bi · Soft",model:"Godox LITEMONS",cct:[2800,6500],rgb:false,pending:true},
  {id:"t1",name:"K60 · Tube L",model:"Viltrox K60",cct:[2500,8500],rgb:true,pending:true},
  {id:"t2",name:"K60 · Tube R",model:"Viltrox K60",cct:[2500,8500],rgb:true,pending:true},
];
const st={};
LIGHTS.forEach((l,i)=> st[l.id]={on:i<5, bri:[90,70,60,45,80,0,0,0][i], cct:l.cct?Math.round((l.cct[0]+l.cct[1])/2):5600});

function kelvinToRGB(k){k/=100;let r,g,b;
  if(k<=66){r=255;g=99.47*Math.log(k)-161.12;}else{r=329.7*Math.pow(k-60,-0.1332);g=288.12*Math.pow(k-60,-0.0755);}
  if(k>=66)b=255;else if(k<=19)b=0;else b=138.52*Math.log(k-10)-305.04;
  const c=v=>Math.max(0,Math.min(255,Math.round(v||0)));return[c(r),c(g),c(b)];}

/* ---------- CARDS ---------- */
function renderCards(){
  const g=document.getElementById("cardsView"); g.innerHTML="";
  LIGHTS.forEach(l=>{
    const s=st[l.id],[r,gr,b]=kelvinToRGB(s.cct);
    const c=document.createElement("div"); c.className="card"+(s.on?"":" off");
    c.style.boxShadow=s.on?`0 14px 50px rgba(${r},${gr},${b},${.10+.35*s.bri/100})`:"0 10px 40px rgba(0,0,0,.5)";
    c.innerHTML=`
      <div class="glow" style="background:radial-gradient(closest-side,rgba(${r},${gr},${b},${s.on?.9:.15}),transparent);"></div>
      <div class="chead">
        <div class="swatch" style="background:rgb(${r},${gr},${b}); opacity:${s.on?.5+.5*s.bri/100:.25};"></div>
        <div><div class="cname">${l.name}</div><div class="cmodel">${l.model}</div>
          <span class="badge ${l.pending?'pend':'gvm'}">${l.pending?'PENDING':'GVM ✓'}</span></div>
        <div class="pw" onclick="toggle('${l.id}')">⏻</div>
      </div>
      <div class="ctrl"><div class="top"><span class="k">Brightness</span><span class="v">${s.bri}%</span></div>
        <input type="range" class="bri" min="0" max="100" value="${s.bri}" oninput="setBri('${l.id}',this.value)"></div>
      ${l.cct?`<div class="ctrl"><div class="top"><span class="k">Color Temp</span><span class="v">${s.cct}K</span></div>
        <input type="range" class="cct" min="${l.cct[0]}" max="${l.cct[1]}" step="50" value="${s.cct}" oninput="setCct('${l.id}',this.value)"></div>`
        :`<div class="cmodel" style="margin-top:13px;">Daylight · 5600K fixed</div>`}`;
    g.appendChild(c);
  });
}
/* ---------- CONSOLE ---------- */
function renderConsole(){
  const d=document.getElementById("deck"); d.innerHTML="";
  const m=document.createElement("div"); m.className="strip master on";
  m.innerHTML=`<div class="scap" style="background:linear-gradient(90deg,#ff9a3c,#fff,#8fb6ff);"></div>
    <div class="sname">MASTER</div><div class="slive">ALL</div>
    <div class="fader int" data-master="1"><div class="ticks"></div><div class="fill" style="height:75%"></div><div class="cap" style="bottom:75%"></div></div>
    <div class="fval">75%</div><div class="fcap-lbl">INTENSITY</div>
    <button class="pw2">ALL ON</button>`;
  d.appendChild(m);
  LIGHTS.forEach(l=>{
    const s=st[l.id],[r,gr,b]=kelvinToRGB(s.cct);
    const strip=document.createElement("div"); strip.className="strip"+(s.on?" on":" off-strip"); strip.dataset.id=l.id;
    strip.innerHTML=`
      <div class="scap" style="background:rgb(${r},${gr},${b}); opacity:${s.on?.5+.5*s.bri/100:.25};"></div>
      <div class="sname">${l.name}</div>
      <div class="${l.pending?'spend':'slive'}">${l.pending?'PENDING':'GVM ✓'}</div>
      <div class="fader int" data-id="${l.id}" data-kind="bri"><div class="ticks"></div>
        <div class="fill" style="height:${s.bri}%"></div><div class="cap" style="bottom:${s.bri}%"></div></div>
      <div class="fval" id="v_${l.id}">${s.bri}%</div><div class="fcap-lbl">INT</div>
      ${l.cct?`<div class="cctmini" id="c_${l.id}">${s.cct}K</div>
        <div class="fader" data-id="${l.id}" data-kind="cct" style="min-height:70px; width:34px;"><div class="fill" style="height:${cctPct(l,s.cct)}%; background:linear-gradient(180deg,#8fb6ff,#ff9a3c)"></div><div class="cap" style="bottom:${cctPct(l,s.cct)}%"></div></div>`
        :`<div class="cctmini">5600K</div>`}
      <button class="pw2" onclick="toggle('${l.id}')">${s.on?'ON':'OFF'}</button>`;
    d.appendChild(strip);
  });
  wireFaders();
}
function cctPct(l,k){return Math.round((k-l.cct[0])/(l.cct[1]-l.cct[0])*100);}
function pctToCct(l,p){return Math.round((l.cct[0]+p/100*(l.cct[1]-l.cct[0]))/50)*50;}

/* ---------- drag faders ---------- */
function wireFaders(){
  document.querySelectorAll('.fader[data-id]').forEach(f=>{
    const move=e=>{
      const rect=f.getBoundingClientRect();
      const y=(e.touches?e.touches[0].clientY:e.clientY);
      let p=Math.round((1-(y-rect.top)/rect.height)*100); p=Math.max(0,Math.min(100,p));
      const id=f.dataset.id, kind=f.dataset.kind, s=st[id], l=LIGHTS.find(x=>x.id===id);
      f.querySelector('.fill').style.height=p+'%'; f.querySelector('.cap').style.bottom=p+'%';
      if(kind==='bri'){ s.bri=p; if(p>0)s.on=true; document.getElementById('v_'+id).textContent=p+'%'; }
      else { s.cct=pctToCct(l,p); document.getElementById('c_'+id).textContent=s.cct+'K'; }
      const strip=f.closest('.strip'); const[r,gr,b]=kelvinToRGB(s.cct);
      strip.querySelector('.scap').style.background=`rgb(${r},${gr},${b})`;
      strip.querySelector('.scap').style.opacity=s.on?.5+.5*s.bri/100:.25;
      strip.classList.toggle('off-strip',!s.on); strip.classList.toggle('on',s.on);
      strip.querySelector('.pw2').textContent=s.on?'ON':'OFF';
    };
    const down=e=>{e.preventDefault(); move(e); const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);};
    f.addEventListener('pointerdown',down);
  });
}
/* ---------- shared actions ---------- */
function toggle(id){ st[id].on=!st[id].on; renderAll(); }
function setBri(id,v){ st[id].bri=+v; if(+v>0)st[id].on=true; renderCards(); }
function setCct(id,v){ st[id].cct=+v; renderCards(); }
function renderAll(){ renderCards(); renderConsole(); }
function setView(v){
  document.getElementById("cardsView").style.display = v==='cards'?'grid':'none';
  document.getElementById("consoleView").style.display = v==='console'?'block':'none';
  document.getElementById("tCards").classList.toggle("on",v==='cards');
  document.getElementById("tConsole").classList.toggle("on",v==='console');
  if(v==='console') renderConsole();
}
renderAll();
if(location.hash==='#console'||location.search.indexOf('console')>=0) setView('console');
</script>
</body>
</html>
