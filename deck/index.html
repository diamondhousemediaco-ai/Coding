<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>LightDeck</title></head><body style="margin:0;background:#08070d;color:#8a8a90;font-family:-apple-system,system-ui,sans-serif">
<div id="l" style="padding:24px">Loading LightDeck…</div>
<script>
fetch('app.html?t='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
  .then(function(h){document.open();document.write(h);document.close();})
  .catch(function(e){document.getElementById('l').textContent='Load failed ('+e+') — tap reload.';});
</script></body></html>
